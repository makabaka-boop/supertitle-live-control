server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：任意路径都回退到 index.html（hash 路由，其实不会产生非根请求）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
